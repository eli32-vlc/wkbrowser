name: build-webkit-stripped

# Builds WebKit from source with media/GPU subsystems removed at build time.
# This is the only piece that satisfies "removed at build time, not stubbed at
# runtime" — everything else in Phase 2 works on the stock binary.
#
# Cost: this is a long build. It only runs on manual dispatch or when the
# build flags change, so the Actions minutes budget is not burned per push.

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: Upload built library as artifact
        type: boolean
        default: true
  push:
    paths:
      - '.github/workflows/build-webkit-stripped.yml'
    branches: [main]

concurrency:
  group: build-webkit
  cancel-in-progress: false

env:
  # Keep the whole job inside the 10 GB project disk budget.
  CCACHE_MAXSIZE: 2G
  WEBKIT_OUTPUTDIR: ${{ github.workspace }}/build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache gperf bison flex \
            python3 python3-dev git wget ca-certificates \
            libgcrypt20-dev libssl-dev libicu-dev libwoff-dev \
            libopus-dev libwebp-dev libwebpdemux2 libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libenchant-2-dev libhyphen-dev libmanette-0.2-dev \
            libgles2-mesa-dev libegl1-mesa-dev libglib2.0-dev \
            libx11-dev libxext-dev libxi-dev libxtst-dev \
            libcairo2-dev libpango1.0-dev libatk1.0-dev libatk-bridge2.0-dev \
            libgtk-3-dev libgdk-pixbuf-2.0-dev libepoxy-dev \
            libwayland-dev wayland-protocols libdrm-dev libgbm-dev \
            libavif-dev libjpeg-dev libopenjp2-7-dev libtiff-dev \
            libsecret-1-dev libnotify-dev libjsoncpp-dev \
            xvfb gir1.2-gtk-3.0
          # NOTE: no gir1.2-webkit2-6.0 here. We build libwebkit ourselves, and
          # the Ubuntu runner does not package that introspection name. GTK3 is
          # the port being built, so gir1.2-gtk-3.0 is the correct dep.

      - uses: actions/cache@v4
        with:
          path: |
            build/ccache
            src/WebKit/WebKitBuild
          key: webkit-stripped-${{ hashFiles('.github/workflows/build-webkit-stripped.yml') }}
          restore-keys: webkit-stripped-

      - name: Shallow clone WebKit (depth 1)
        # Full history is ~13 GB and would blow the 10 GB project cap by itself.
        run: |
          git clone --depth 1 https://github.com/WebKit/WebKit.git src/WebKit
          du -sh src/WebKit

      - name: Patch GStreamer so USE_GSTREAMER=OFF actually sticks
        # Upstream PR #61274: USE_GSTREAMER is unconditionally forced back to
        # TRUE if any of ENABLE_VIDEO / ENABLE_WEB_AUDIO / ENABLE_WEB_CODECS is
        # set. We already pass the flags, so this is belt-and-braces, but the
        # grep in the verify step below is the real assertion.
        run: |
          cd src/WebKit
          sed -i 's/^\(\s*\)set(USE_GSTREAMER \(TRUE\|ON\)\)/\1message(STATUS "wkb: USE_GSTREAMER forced OFF")\n\1set(USE_GSTREAMER OFF)/' \
            Source/cmake/GStreamerChecks.cmake || true
          grep -n 'USE_GSTREAMER' Source/cmake/GStreamerChecks.cmake | head

      - name: Configure (Release, stripped)
        run: |
          set -euo pipefail
          cd src/WebKit
          # NOTE: pass cmakeargs on ONE line. A multi-line YAML folded string
          # gets flattened to spaces with no continuation, so every flag after
          # the first is read as a separate shell command.
          ARGS="-GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE=-O1"
          ARGS="$ARGS -DENABLE_WEB_RTC=OFF"
          ARGS="$ARGS -DENABLE_WEBXR=OFF -DENABLE_WEBXR_AR=OFF -DENABLE_WEBXR_HANDS=OFF"
          ARGS="$ARGS -DENABLE_WEBXR_HIT_TEST=OFF -DENABLE_WEBXR_LAYERS=OFF"
          ARGS="$ARGS -DENABLE_GAMEPAD=OFF -DENABLE_MEDIA_STREAM=OFF"
          ARGS="$ARGS -DENABLE_WEB_CODECS=OFF -DENABLE_VIDEO=OFF -DENABLE_WEB_AUDIO=OFF"
          ARGS="$ARGS -DENABLE_SPEECH_SYNTHESIS=OFF -DENABLE_MHTML=OFF"
          ARGS="$ARGS -DENABLE_PDFJS=OFF -DENABLE_XSLT=OFF -DENABLE_JOURNALD_LOG=OFF"
          ARGS="$ARGS -DENABLE_WEBDRIVER=OFF -DENABLE_DEVELOPER_MODE=OFF"
          ARGS="$ARGS -DENABLE_EXPERIMENTAL_FEATURES=OFF -DENABLE_API_TESTS=OFF"
          ARGS="$ARGS -DENABLE_INTROSPECTION=OFF -DUSE_GSTREAMER=OFF"
          echo "cmake args: $ARGS"
          Tools/Scripts/build-webkit --release --gtk --only-webkit \
            --cmakeargs="$ARGS" 2>&1 | tee configure.log | tail -40
          # Prove the flags actually took effect, do not trust exit status.
          echo "--- cache verification ---"
          CFG=WebKitBuild/GTK/Release/CMakeCache.txt
          for K in USE_GSTREAMER ENABLE_WEB_RTC ENABLE_MEDIA_STREAM ENABLE_WEB_CODECS; do
            printf '%-24s %s\n' "$K" "$(grep -E "^$K:" "$CFG" || echo 'ABSENT')"
          done
          echo "--- build dir created? ---"
          find . -maxdepth 2 -name 'WebKitBuild*' -type d

      - name: Build
        run: |
          set -o pipefail
          cd src/WebKit
          export CCACHE_DIR=${{ github.workspace }}/build/ccache
          # build-webkit configures in-tree at WebKitBuild/<port>/<config>.
          # WEBKIT_OUTPUTDIR is NOT honoured for the configure location.
          # -l caps load so the 16 GB runner does not OOM on link steps.
          ninja -C WebKitBuild/GTK/Release -j2 -l3.0 2>&1 | tee build.log | tail -30

      - name: Verify media is actually gone (not stubbed)
        run: |
          set -euo pipefail
          LIB=$(find src/WebKit/WebKitBuild -name 'libwebkitgtk-*.so.*' -type f | head -1)
          if [ -z "$LIB" ]; then
            echo "FAIL: no libwebkitgtk shared object found under src/WebKit/WebKitBuild"
            echo "--- what was actually built ---"
            find src/WebKit/WebKitBuild -name '*.so*' -type f | head -20
            exit 1
          fi
          echo "lib: $LIB"
          echo "--- GStreamer deps (must be empty) ---"
          if readelf -d "$LIB" | grep -i gst; then
            echo "FAIL: GStreamer still linked"
            exit 1
          fi
          echo "OK: no libgst* dependency"
          echo "--- library size ---"
          ls -lh "$LIB"
          echo "--- total build dir size (10 GB cap) ---"
          du -sh src/WebKit/WebKitBuild src/WebKit
          df -h /
          echo "OK: verification passed"

      - name: Measure RSS delta
        run: |
          set -uo pipefail
          RELEASEDIR=src/WebKit/WebKitBuild/GTK/Release
          if [ ! -d "$RELEASEDIR" ]; then
            echo "no $RELEASEDIR; skipping RSS measurement"
            exit 0
          fi
          echo "Baseline to compare against: 414 MB unstripped"
          if [ -f "$RELEASEDIR/bin/MiniBrowser" ] || [ -f "$RELEASEDIR/Programs/MiniBrowser" ]; then
            MB=$(find "$RELEASEDIR" -name 'MiniBrowser' -type f | head -1)
            echo "launching $MB under xvfb with software GL to sample RSS"
            LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
              xvfb-run -a -s '-screen 0 1280x800x24' \
              timeout 30 "$MB" "data:text/html,<h1>ci</h1>" &
            BGPID=$!
            PEAK=0
            for _ in $(seq 1 20); do
              sleep 1
              T=$(ps -eo rss,args | grep -iE '[M]iniBrowser|[W]ebKit' | awk '{s+=$1} END {print s+0}')
              [ "${T:-0}" -gt "$PEAK" ] && PEAK=$T
            done
            kill $BGPID 2>/dev/null || true
            echo "PEAK RSS: $((PEAK/1024)) MB (baseline 414 MB)"
          else
            echo "MiniBrowser not found in $RELEASEDIR; library-only build verified"
          fi

      - name: Upload artifact
        if: ${{ inputs.upload_artifact != false }}
        uses: actions/upload-artifact@v4
        with:
          name: webkitgtk-stripped
          path: |
            src/WebKit/WebKitBuild/GTK/Release/lib/
            src/WebKit/WebKitBuild/GTK/Release/bin/
          retention-days: 30
