name: build-webkit-stripped

# Builds WebKit from source with media/GPU subsystems removed at build time.
# This is the only piece that satisfies "removed at build time, not stubbed at
# runtime" — everything else in Phase 2 works on the stock binary.
#
# Cost: this is a long build. It only runs on manual dispatch or when the
# build flags change, so the Actions minutes budget is not burned per push.

on:
  # Manual dispatch only. An earlier revision also fired on push, which
  # duplicated every dispatch and burned the free-tier minutes.
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: Upload built library as artifact
        type: boolean
        default: true

concurrency:
  group: build-webkit
  cancel-in-progress: false

env:
  # Keep the whole job inside the 10 GB project disk budget.
  CCACHE_MAXSIZE: 2G
  WEBKIT_OUTPUTDIR: ${{ github.workspace }}/build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Shallow clone WebKit (depth 1)
        # Full history is ~13 GB and would blow the 10 GB project cap by itself.
        run: |
          # Pinned so a failure is reproducible. Bump deliberately rather
          # than tracking main, which moves under you mid-build.
          #
          # PIN RATIONALE: this commit predates 2026-09-01, the day
          # Source/WebKit/Shared/RunJavaScriptResult.swift landed. That file
          # imports JavaScriptCore_Private.Cxx.* modules which exist only in
          # WebKit's own Swift toolchain, and the build cannot complete on a
          # stock runner. The interop imports were confirmed absent from
          # every Swift file that failed at the newer pin.
          git clone --depth 1 https://github.com/WebKit/WebKit.git src/WebKit
          cd src/WebKit
          git fetch --depth 1 origin 48985e195c6fddb7395ad65e72a7614f12366ae2
          git checkout 48985e195c6fddb7395ad65e72a7614f12366ae2
          cd ../..
          du -sh src/WebKit

      - name: Install build dependencies (apt, explicit)
        # NOTE: there is no Tools/Scripts/install-dependencies in current
        # WebKit main. The list below is the GTK4-port dependency set; the
        # second block is a reduced fallback if any optional package is
        # missing on the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache gperf bison flex \
            python3 python3-dev git wget ca-certificates pkg-config \
            libgcrypt20-dev libssl-dev libicu-dev libwoff-dev libjansson-dev \
            libwebp-dev libavif-dev libjpeg-dev libopenjp2-7-dev libtiff-dev \
            libjxl-dev libwebpdemux2 libsharpyuv-dev libheif-dev \
            libsecret-1-dev libnotify-dev libjsoncpp-dev libtasn1-6-dev \
            libsoup-3.0-dev libpsl-dev libsqlite3-dev \
            libcairo2-dev libpango1.0-dev libatk1.0-dev \
            libatk-bridge2.0-dev libgtk-4-dev libgtk-3-dev \
            libgdk-pixbuf-2.0-dev libepoxy-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxi-dev libxtst-dev libxcursor-dev \
            libwayland-dev wayland-protocols libdrm-dev libgbm-dev \
            libhyphen-dev libenchant-2-dev libmanette-0.2-dev \
            libopus-dev xvfb gir1.2-gtk-4.0 gir1.2-gtk-3.0 \
          || { echo "WARN: falling back to reduced dependency set"; \
               sudo apt-get install -y --no-install-recommends \
                 build-essential cmake ninja-build ccache gperf bison flex \
                 python3 git ca-certificates pkg-config \
                 libgcrypt20-dev libssl-dev libicu-dev libwoff-dev \
                 libgtk-4-dev libgtk-3-dev libcairo2-dev libpango1.0-dev \
                 libegl1-mesa-dev libgles2-mesa-dev libgbm-dev \
                 libsoup-3.0-dev libtasn1-6-dev libjansson-dev libsqlite3-dev \
                 xvfb; }

      - uses: actions/cache@v4
        with:
          path: |
            build/ccache
            src/WebKit/webkit-build
          key: webkit-stripped-${{ hashFiles('.github/workflows/build-webkit-stripped.yml') }}
          restore-keys: webkit-stripped-

      - name: Auto-install any missing optional libraries
        timeout-minutes: 45
        # Rather than burn a full runner per unknown optional dep, probe
        # configure and retry, installing whatever CMake just complained about.
        run: |
          # No cd here: paths below are relative to the workspace root.
          # An earlier revision did `cd src/WebKit` then passed -S src/WebKit,
          # which resolved to src/WebKit/src/WebKit.
          # A real argv array from the start. Rounding this through a string
          # and word-splitting it destroys any -D value containing a space,
          # which is exactly how the clang warning flags were silently lost.
          ARGV=(-S src/WebKit -B src/WebKit/webkit-build -G Ninja
                -DPORT=GTK
                -DCMAKE_BUILD_TYPE=Release
                -DCMAKE_C_COMPILER=clang
                -DCMAKE_CXX_COMPILER=clang++
                -DCMAKE_C_FLAGS=-Wno-error=ignored-attributes
                "-DCMAKE_CXX_FLAGS=-Wno-error=ignored-attributes -Wno-error=pass-failed"
                -DENABLE_WEB_RTC=OFF
                -DENABLE_WEBXR=OFF -DENABLE_WEBXR_AR=OFF
                -DENABLE_WEBXR_HANDS=OFF -DENABLE_WEBXR_HIT_TEST=OFF
                -DENABLE_WEBXR_LAYERS=OFF
                -DENABLE_GAMEPAD=OFF -DENABLE_MEDIA_STREAM=OFF
                -DENABLE_WEB_CODECS=OFF -DENABLE_VIDEO=OFF -DENABLE_WEB_AUDIO=OFF
                -DENABLE_SPEECH_SYNTHESIS=OFF -DENABLE_MHTML=OFF
                -DENABLE_PDFJS=OFF -DENABLE_XSLT=OFF -DENABLE_JOURNALD_LOG=OFF
                -DENABLE_WEBDRIVER=OFF -DENABLE_DEVELOPER_MODE=OFF
                -DENABLE_EXPERIMENTAL_FEATURES=OFF -DENABLE_API_TESTS=OFF
                -DENABLE_INTROSPECTION=OFF
                -DUSE_GSTREAMER=OFF)
          # Append flags discovered by the dependency retry loop.
          EXTRA=()


          for ATTEMPT in 1 2 3 4 5 6 7 8; do
            echo "===== configure attempt $ATTEMPT ====="
            # Stream progress to the job summary; a 5h job with no output
            # cannot be diagnosed after the fact.
            echo "### configure attempt $ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
            date -u '+%H:%M:%S attempting configure' >> "$GITHUB_STEP_SUMMARY"
            # Hard bound per attempt. A previous run hung here for 100 minutes
            # with no output at all, which is worse than failing: it ate the
            # entire job budget and told us nothing.
            # Run cmake directly rather than build-webkit. build-webkit always
            # follows configure with a full build (JavaScriptCore alone is ~2564
            # targets), so a dependency retry loop around it either hangs for
            # hours or gets killed mid-compile. cmake configures and exits.
            rc=0
            # `cmd || rc=$?` rather than `if cmd; then ...; fi; rc=$?`: the
            # latter captures the compound's status, which is 0 whenever no
            # else branch ran, silently losing the timeout code.
            timeout 900 cmake "${ARGV[@]}" "${EXTRA[@]}" \
                > /tmp/wkb-configure.log 2>&1 || rc=$?
            if [ $rc -eq 0 ]; then
              echo "CONFIGURE_OK"
              exit 0
            fi
            MISSING=$(grep -oE 'Could NOT find [A-Za-z0-9_]+' /tmp/wkb-configure.log \
                      | head -1 | awk '{print $4}')
            if [ $rc -eq 124 ]; then
              echo "configure attempt $ATTEMPT TIMED OUT after 900s; skipping to next"
              # A failed configure leaves a partial cache behind; clear it so
              # the next attempt starts clean rather than inheriting bad state.
              rm -rf src/WebKit/webkit-build/CMakeCache.txt
              rm -rf src/WebKit/webkit-build/CMakeFiles
              continue
            fi
            echo "configure asked for: ${MISSING:-<none parsed>}" >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$MISSING" ]; then
              echo "configure failed for a reason other than a missing library"
              tail -40 /tmp/wkb-configure.log
              exit 1
            fi
            PKG=""
            case "$MISSING" in
              LibBacktrace)
                # Not packaged on Ubuntu or Debian; only powers Release-build
                # stack traces, so turn the feature off instead.
                EXTRA+=(-DUSE_LIBBACKTRACE=OFF) ;;
              Libseccomp|bubblewrap|Bubblewrap)
                # No multi-tenant threat model in a single-user headless
                # scraper, so the process sandbox is unnecessary weight.
                EXTRA+=(-DENABLE_BUBBLEWRAP_SANDBOX=OFF) ;;
              Unifdef)         PKG=unifdef ;;
              Gettext|gettext)  PKG=gettext ;;
              Bison)           PKG=bison ;;
              Flex)            PKG=flex ;;
              Gperf)           PKG=gperf ;;
              Ninja)           PKG=ninja-build ;;
              Perl)            PKG=perl ;;
              Python)          PKG=python3-dev ;;
              JPEGXL)          PKG=libjxl-dev ;;
              AVIF)            PKG=libavif-dev ;;
              WebP)            PKG=libwebp-dev ;;
              HEIF)            PKG=libheif-dev ;;
              LittleCMS)       PKG=liblcms2-dev ;;
              LibSoup3|Soup3)  PKG=libsoup-3.0-dev ;;
              Soup)            PKG=libsoup-3.0-dev ;;
              WPE|Wayland)     PKG=libwayland-dev ;;
              X11)             PKG=libx11-dev ;;
              EGL|GLES)        PKG=libegl1-mesa-dev ;;
              Vulkan)          PKG=libvulkan-dev ;;
              Fontconfig)      PKG=libfontconfig-dev ;;
              Freetype)        PKG=libfreetype6-dev ;;
              OpenSSL)         PKG=libssl-dev ;;
              Libgcrypt)       PKG=libgcrypt20-dev ;;
              SQLite)          PKG=libsqlite3-dev ;;
              GTK)             PKG=libgtk-4-dev ;;
              Pango)           PKG=libpango1.0-dev ;;
              Cairo)           PKG=libcairo2-dev ;;
              GStreamer)       PKG=libgstreamer1.0-dev ;;
              GLib)            PKG=libglib2.0-dev ;;
              *)
                # General fallback: try lib<name>-dev, then <name>, then
                # anything apt knows containing the name.
                LOW=${MISSING,,}
                PKG=$(apt-cache search --names-only "lib${LOW}-dev" 2>/dev/null \
                      | head -1 | cut -d' ' -f1)
                if [ -z "$PKG" ]; then
                  PKG=$(apt-cache search --names-only "$LOW" 2>/dev/null \
                        | grep -E "^(lib)?${LOW}" | head -1 | cut -d' ' -f1)
                fi
                if [ -z "$PKG" ]; then
                  PKG=$(apt-cache search "$LOW" 2>/dev/null \
                        | grep -iE " - " | head -1 | cut -d' ' -f1)
                fi ;; 
            esac
            if [ -n "$PKG" ]; then
              echo "installing $PKG for $MISSING"
              sudo apt-get install -y "$PKG" || true
            fi
            if [ "$MISSING" = "LibBacktrace" ] || [ "$MISSING" = "Libseccomp" ] \
               || [ "$MISSING" = "bubblewrap" ] || [ "$MISSING" = "Bubblewrap" ]; then
              echo "flag changed, will retry with adjusted args"
            elif [ -z "$PKG" ]; then
              echo "no package known for $MISSING; stopping"
              tail -30 /tmp/wkb-configure.log
              exit 1
            fi
          done
          echo "configure did not converge in 8 attempts"
          tail -40 /tmp/wkb-configure.log
          exit 1

      - name: Patch GStreamer so USE_GSTREAMER=OFF actually sticks
        # Upstream PR #61274: USE_GSTREAMER is unconditionally forced back to
        # TRUE if any of ENABLE_VIDEO / ENABLE_WEB_AUDIO / ENABLE_WEB_CODECS is
        # set. We already pass the flags, so this is belt-and-braces, but the
        # grep in the verify step below is the real assertion.
        run: |
          cd src/WebKit
          sed -i 's/^\(\s*\)set(USE_GSTREAMER \(TRUE\|ON\)\)/\1message(STATUS "wkb: USE_GSTREAMER forced OFF")\n\1set(USE_GSTREAMER OFF)/' \
            Source/cmake/GStreamerChecks.cmake || true
          grep -n 'USE_GSTREAMER' Source/cmake/GStreamerChecks.cmake | head
          # Clang rejects __attribute__((noescape)) on non-pointer parameters,
          # and WebKit compiles with -Werror. Strip the attribute rather than
          # rely on warning suppression surviving every flag path.
          sed -i 's/__attribute__((noescape))//g' Source/WTF/wtf/StdLibExtras.h
          echo "noescape attributes remaining: $(grep -c noescape Source/WTF/wtf/StdLibExtras.h || true)"

      - name: Verify configure cache reflects the strip flags
        # The retry loop already ran a successful configure. Assert the
        # stripping actually took effect instead of trusting exit status.
        run: |
          set -euo pipefail
          # Discover the cache rather than hardcoding a path: with
          # --generate-project-only the location differs from the old
          # WebKitBuild/GTK/Release assumption.
          CFG=$(find src/WebKit -maxdepth 4 -name CMakeCache.txt | head -1)
          if [ -z "$CFG" ]; then
            echo "FAIL: no CMakeCache found under src/WebKit"
            find src/WebKit -maxdepth 4 \( -name CMakeCache.txt -o -name build.ninja \) | head
            exit 1
          fi
          echo "cache: $CFG"
          echo "build dir: $(dirname "$CFG")"
          echo "--- resolved strip flags ---"
          for K in USE_GSTREAMER ENABLE_WEB_RTC ENABLE_MEDIA_STREAM \
                   ENABLE_WEB_CODECS ENABLE_VIDEO ENABLE_GAMEPAD \
                   ENABLE_SPEECH_SYNTHESIS ENABLE_MHTML; do
            printf '%-26s %s\n' "$K" "$(grep -E "^$K:" "$CFG" | cut -d= -f2 || echo ABSENT)"
          done
          if grep -E '^USE_GSTREAMER:' "$CFG" | grep -qi ':BOOL=ON'; then
            echo "FAIL: USE_GSTREAMER is ON, media was not stripped"
            exit 1
          fi
          echo "OK: USE_GSTREAMER is not ON"

      - name: Build
        run: |
          set -o pipefail
          cd src/WebKit
          export CCACHE_DIR=${{ github.workspace }}/build/ccache
          # Where the configure step actually put the build files.
          CFG_DIR=webkit-build
          test -f "$CFG_DIR/CMakeCache.txt" || { echo "FAIL: no CMakeCache in $CFG_DIR"; exit 1; }
          echo "building in: $CFG_DIR"
          # WebKit is ~2564 targets. At -j2 a full Release build is 6-8 hours,
          # which exceeds the job budget; -j3 with a load cap of 2.5 fits the
          # 4-core / 16 GB runner and lands near 4-5 hours.
          ninja -C "$CFG_DIR" -j3 -l2.5 2>&1 | tee build.log | tail -40

      - name: Verify media is actually gone (not stubbed)
        run: |
          set -euo pipefail
          LIB=$(find src/WebKit/webkit-build -name 'libwebkitgtk-*.so.*' -type f | head -1)
          if [ -z "$LIB" ]; then
            echo "FAIL: no libwebkitgtk shared object found under src/WebKit/webkit-build"
            echo "--- what was actually built ---"
            find src/WebKit/webkit-build -name '*.so*' -type f | head -20
            exit 1
          fi
          echo "lib: $LIB"
          echo "--- GStreamer deps (must be empty) ---"
          if readelf -d "$LIB" | grep -i gst; then
            echo "FAIL: GStreamer still linked"
            exit 1
          fi
          echo "OK: no libgst* dependency"
          echo "--- library size ---"
          ls -lh "$LIB"
          echo "--- total build dir size (10 GB cap) ---"
          du -sh src/WebKit/webkit-build src/WebKit
          df -h /
          echo "OK: verification passed"

      - name: Measure RSS delta
        run: |
          set -uo pipefail
          RELEASEDIR=src/WebKit/webkit-build/GTK/Release
          if [ ! -d "$RELEASEDIR" ]; then
            echo "no $RELEASEDIR; skipping RSS measurement"
            exit 0
          fi
          echo "Baseline to compare against: 414 MB unstripped"
          if [ -f "$RELEASEDIR/bin/MiniBrowser" ] || [ -f "$RELEASEDIR/Programs/MiniBrowser" ]; then
            MB=$(find "$RELEASEDIR" -name 'MiniBrowser' -type f | head -1)
            echo "launching $MB under xvfb with software GL to sample RSS"
            LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
              xvfb-run -a -s '-screen 0 1280x800x24' \
              timeout 30 "$MB" "data:text/html,<h1>ci</h1>" &
            BGPID=$!
            PEAK=0
            for _ in $(seq 1 20); do
              sleep 1
              T=$(ps -eo rss,args | grep -iE '[M]iniBrowser|[W]ebKit' | awk '{s+=$1} END {print s+0}')
              [ "${T:-0}" -gt "$PEAK" ] && PEAK=$T
            done
            kill $BGPID 2>/dev/null || true
            echo "PEAK RSS: $((PEAK/1024)) MB (baseline 414 MB)"
          else
            echo "MiniBrowser not found in $RELEASEDIR; library-only build verified"
          fi

      - name: Upload artifact
        if: ${{ inputs.upload_artifact != false }}
        uses: actions/upload-artifact@v4
        with:
          name: webkitgtk-stripped
          path: |
            src/WebKit/webkit-build/GTK/Release/lib/
            src/WebKit/webkit-build/GTK/Release/bin/
          retention-days: 30
